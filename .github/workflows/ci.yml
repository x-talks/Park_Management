name: CI

on:
  push:
    branches: [main, feat/react-migration, feat/svelte-migration]
  pull_request:
    branches: [main, feat/react-migration, feat/svelte-migration]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run test:unit -- --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e-tests:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    env:
      STAGING_SUPABASE_URL:         ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY:    ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SERVICE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_KEY }}
      STAGING_WORKER_URL:           ${{ secrets.STAGING_WORKER_URL }}
      STAGING_ADMIN_PASSWORD:       ${{ secrets.STAGING_ADMIN_PASSWORD }}
      STAGING_MASTER_PASSWORD:      ${{ secrets.STAGING_MASTER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Cache Playwright browser binaries — keyed on Playwright version so a
      # version bump automatically busts the cache and re-downloads.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Always install OS deps (shared libs) even when browser binary is cached —
      # they live outside ~/.cache/ms-playwright and are not restored by the cache.
      - name: Install Playwright OS dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Apply schema to staging
        run: |
          echo "Applying db/schema.sql to staging Supabase..."
          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/yuoqbjopaemikxiwvtup/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $(jq -Rs . < db/schema.sql)}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE: $BODY"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Schema apply failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Schema applied. Reloading PostgREST schema cache..."
          RELOAD=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/yuoqbjopaemikxiwvtup/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"NOTIFY pgrst, '\''reload schema'\''"}')
          RELOAD_CODE=$(echo "$RELOAD" | tail -1)
          echo "Reload HTTP $RELOAD_CODE"
          sleep 3

      - name: Seed staging database
        run: |
          node tests/fixtures/staging-config.js
          node tests/fixtures/seed.js

      - name: Warm up worker (fail fast if unreachable)
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Warm-up attempt $attempt..."
            RESPONSE=$(curl -sS -m 15 -X POST "$STAGING_WORKER_URL/auth/login" \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"TEST-ADMIN\",\"password\":\"$STAGING_ADMIN_PASSWORD\"}" || true)
            echo "$RESPONSE" | grep -q '"accessToken"' && { echo "Worker OK"; exit 0; }
            echo "No token yet; response: $RESPONSE"
            sleep 5
          done
          echo "Worker unreachable after 5 attempts."
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          SKIP_SEED: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7

  svelte-e2e-tests:
    name: Svelte E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]

    env:
      STAGING_SUPABASE_URL:         ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY:    ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SERVICE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_KEY }}
      STAGING_WORKER_URL:           ${{ secrets.STAGING_WORKER_URL }}
      STAGING_ADMIN_PASSWORD:       ${{ secrets.STAGING_ADMIN_PASSWORD }}
      STAGING_MASTER_PASSWORD:      ${{ secrets.STAGING_MASTER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Install root deps (seed/setup scripts live there)
      - run: npm ci

      # Install Svelte app deps
      - run: npm ci
        working-directory: svelte-app

      # Cache Playwright browser binaries for the svelte-app
      - name: Cache Playwright browsers (svelte)
        id: pw-cache-svelte
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-svelte-${{ hashFiles('svelte-app/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache-svelte.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: svelte-app

      - name: Install Playwright OS dependencies
        if: steps.pw-cache-svelte.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: svelte-app

      # Seed staging (shared staging DB, same seed as vanilla E2E)
      - name: Seed staging database
        run: |
          node tests/fixtures/staging-config.js
          node tests/fixtures/seed.js

      - name: Warm up worker
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Warm-up attempt $attempt..."
            RESPONSE=$(curl -sS -m 15 -X POST "$STAGING_WORKER_URL/auth/login" \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"TEST-ADMIN\",\"password\":\"$STAGING_ADMIN_PASSWORD\"}" || true)
            echo "$RESPONSE" | grep -q '"accessToken"' && { echo "Worker OK"; exit 0; }
            sleep 5
          done
          echo "Worker unreachable after 5 attempts."
          exit 1

      - name: Run Svelte E2E tests
        run: npm run test:e2e
        working-directory: svelte-app
        env:
          SKIP_SEED: "1"

      - name: Upload Svelte Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: svelte-playwright-report
          path: svelte-app/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Svelte app dependencies
        run: npm ci
        working-directory: svelte-app

      - name: Build Svelte app
        run: npm run build
        working-directory: svelte-app
        env:
          BASE_PATH: /Park_Management/svelte
          VITE_SUPABASE_URL:      ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          VITE_WORKER_URL:        ${{ secrets.PROD_WORKER_URL }}

      - name: Assemble deploy artifact
        run: |
          mkdir -p _site
          # Copy vanilla app (everything except node_modules, .git, svelte-app, tests, docs)
          rsync -a --exclude=node_modules --exclude=.git --exclude=svelte-app \
            --exclude=tests --exclude=coverage --exclude=docs --exclude=_site \
            --exclude='.github' --exclude='.superpowers' \
            . _site/
          # Copy Svelte build under /svelte/
          mkdir -p _site/svelte
          cp -r svelte-app/build/. _site/svelte/

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
