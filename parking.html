<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#818cf8"/>
<title data-i18n="app.name">Park Management</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"/>
<script>!function(){var t=localStorage.getItem("pm-theme");if(t&&t!=="light")document.documentElement.dataset.theme=t==="dark-deep"?"dark-glass":t}()</script>
</head>
<body>

<header class="site-header">
  <a href="parking.html" class="logo-link" style="flex-shrink:0">
    <img src="logo.png" alt="" style="height:28px;width:auto;filter:invert(1);opacity:0.9" onerror="this.style.display='none'"/>
  </a>
  <span id="header-section-name" class="header-section-name" data-i18n="nav.map">Map</span>
  <div class="header-controls">
    <div id="user-chip-nav"></div>
    <div class="hamburger-wrap" id="hamburger-wrap">
      <button class="icon-btn hamburger-btn" id="hamburger-btn" title="Menu" aria-label="Menu">
        <i data-lucide="menu"></i>
      </button>
      <div class="hamburger-menu" id="hamburger-menu">
        <div id="lang-switcher-nav"></div>
        <button id="theme-toggle" class="icon-btn" title="Light"><i data-lucide="sun"></i></button>
        <button id="logout-link" class="icon-btn" title="Logout" data-i18n-title="nav.logout" style="font-size:1.1rem">⎋</button>
      </div>
    </div>
  </div>
</header>

<div class="page-wrap">

  <!-- Map card -->
  <div class="card" style="padding:1rem">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:0.75rem;margin-bottom:0.75rem;flex-wrap:wrap">
      <a href="https://maps.google.com/?q=Kaiser-Wilhelm-Stra%C3%9Fe+63,+67059+Ludwigshafen"
         target="_blank" rel="noopener"
         style="font-size:0.8rem;color:var(--text-secondary);text-decoration:none;display:flex;align-items:center;gap:0.3rem">
        📍 Kaiser-Wilhelm-Straße 63, 67059 Ludwigshafen
      </a>
    </div>
      <!-- padding makes room for axis labels that sit in the SVG viewBox overflow space -->
      <div style="padding: 12px 40px 4px 40px">
        <svg id="parking-svg" viewBox="-60 -20 380 540"
             style="width:100%;height:auto;display:block;overflow:visible">
        </svg>
      </div>

    <!-- Legend -->
    <div class="map-legend">
      <span style="font-size:0.75rem;color:var(--gray-600);font-weight:700;text-transform:uppercase;letter-spacing:.04em" data-i18n="map.legend">Legend:</span>
      <span class="legend-item"><span class="legend-swatch free"></span> <span data-i18n="map.legend.free">Free</span></span>
      <span class="legend-item"><span class="legend-swatch occupied"></span> <span data-i18n="map.legend.occupied">Occupied</span></span>
      <span class="legend-item"><span class="legend-swatch reserved"></span> <span data-i18n="map.legend.reserved">Reserved (external)</span></span>
      <span class="legend-item"><span class="legend-swatch pending"></span> <span data-i18n="map.legend.pending">Pending</span></span>
    </div>

    <!-- Info panel — kept hidden for E2E test selector compatibility -->
    <div id="info-panel" style="display:none"></div>
  </div>

  <!-- Spot detail bottom sheet -->
  <div id="sheet-backdrop" class="sheet-backdrop" onclick="closeBottomSheet()"></div>
  <div id="spot-sheet" class="spot-sheet">
    <div class="sheet-handle" onclick="closeBottomSheet()"></div>
    <div id="sheet-content" class="sheet-content"></div>
  </div>

  <!-- My Spots & Payments -->

</div>

<nav class="bottom-nav" id="bottom-nav"></nav>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script src="js/parking.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/de.js"></script>
<script src="js/i18n/tr.js"></script>
<script src="js/i18n.js"></script>
<script src="js/toast.js"></script>
<script>
buildSwitcher('lang-switcher-nav');
applyPage();
const currentUser = requireAuth('renter');
buildUserChip('user-chip-nav', currentUser);
document.getElementById('logout-link').addEventListener('click', () => logout());

// ── Hamburger menu ────────────────────────────────────────────────────────────
(function() {
  const btn = document.getElementById('hamburger-btn');
  const wrap = document.getElementById('hamburger-wrap');
  btn.addEventListener('click', e => { e.stopPropagation(); wrap.classList.toggle('open'); });
  document.addEventListener('click', () => wrap.classList.remove('open'));
})();

// Build role-aware bottom nav: Map(active) / [Admin] / Payments / Incidents / Profile
function buildBottomNav() {
  const nav = document.getElementById('bottom-nav');
  nav.innerHTML = '';
  const isAdmin = currentUser.role === 'admin' || currentUser.role === 'master';
  const tabs = [
    { href: 'parking.html',  icon: '🗺',  label: t('nav.map'),       active: true  },
    { href: 'payments.html', icon: '💳',  label: t('nav.payments'),  active: false },
    { href: 'incident.html', icon: '⚠️',  label: t('nav.incidents'), active: false },
    { href: 'profile.html',  icon: '👤',  label: t('nav.profile'),   active: false },
  ];
  if (isAdmin) {
    tabs.splice(1, 0, { href: 'admin.html', icon: '⚙️', label: t('nav.admin'), active: false });
    const pi = tabs.findIndex(tb => tb.href === 'payments.html');
    if (pi !== -1) tabs.splice(pi, 1);
  }
  tabs.forEach(tab => {
    const a = document.createElement('a');
    a.href = tab.href;
    if (tab.active) a.className = 'active';
    a.innerHTML = `<span class="bn-icon">${tab.icon}</span><span>${tab.label}</span>`;
    nav.appendChild(a);
  });
}
buildBottomNav();

// ── Init & real-time refresh ──────────────────────────────────────────────────
let _spots = [], _users = [], _payments = [], _pendingRegs = [];

async function loadAll() {
  [_spots, _users, _payments, _pendingRegs] = await Promise.all([
    readFile('data/spots.json'),
    readFile('data/users.json'),
    readFile('data/payments.json'),
    readFile('data/pending_registrations').catch(() => [])
  ]);
}

async function refresh() {
  await loadAll();
  const pendingSpotIds = new Set(_pendingRegs.map(pr => pr.spotId));
  buildSVG(_spots, _users, currentUser, pendingSpotIds);
}

// Poll every 30 s + refresh on tab focus
refresh();
setInterval(refresh, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
window.addEventListener('langchange', () => { applyPage(); buildBottomNav(); });
</script>
<script type="module">
  import { createIcons, icons } from 'https://cdn.jsdelivr.net/npm/lucide@latest/dist/esm/lucide.js';
  import { initTheme, cycleTheme } from './js/theme.js';
  window.lucide = { createIcons: () => createIcons({ icons }) };
  initTheme();
  window.lucide.createIcons();
  document.getElementById('theme-toggle').addEventListener('click', cycleTheme);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
