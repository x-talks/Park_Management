<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#818cf8" />
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<!-- Pre-paint theme: apply saved theme before first paint to avoid FOUC.
		     Legacy 'dark-deep' migrates to 'dark-glass'. -->
		<script>
			(function () {
				var t = localStorage.getItem('pm-theme');
				if (t && t !== 'light')
					document.documentElement.dataset.theme = t === 'dark-deep' ? 'dark-glass' : t;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
